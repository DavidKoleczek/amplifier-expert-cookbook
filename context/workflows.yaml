# Workflow Catalog
# ================
# This file defines available workflows for the AI router.
# Toggle workflows by setting `enabled: true/false`.
# Add new workflows by copying an existing entry.
#
# The AI uses the `description` field to determine if a user's request
# matches a workflow. No explicit triggers needed - just describe what
# the workflow does clearly.

workflows:
  # ============================================================================
  # DEFAULT WORKFLOW - Use for most non-trivial tasks
  # ============================================================================
  - id: generic-task
    name: "Generic Task Builder"
    enabled: true
    description: >
      General-purpose workflow for building any software, scripts, tools,
      automations, or coding tasks. This is the DEFAULT choice for most
      non-trivial requests. Uses a streamlined 3-phase approach: capability
      reconnaissance, modular component building, and end-to-end integration
      with testing. Use this unless the request specifically matches ARC-AGI
      puzzles or explicitly requires the comprehensive CLI Tool Builder workflow.
    recipe: "@amplifier-expert-cookbook:generic-task/recipes/generic-task.yaml"
    context:
      required:
        - name: task_description
          description: "Description of what to build"
      optional:
        - name: project_dir
          description: "Target directory for the project"
          default: "."
        - name: working_dir
          description: "Directory for intermediate artifacts"
          default: ".ai_working"

  # ============================================================================
  # SPECIALIZED WORKFLOWS - Only use when explicitly matched
  # ============================================================================
  - id: arc-agi
    name: "ARC-AGI Solver"
    enabled: true
    description: >
      Solve ARC-AGI-2 tasks using iterative code synthesis with parallel experts
      and majority voting. ONLY use this for ARC-AGI puzzles, grid transformation
      challenges, or any task explicitly mentioning the ARC-AGI benchmark. Do NOT
      use for general coding tasks.
    recipe: "@amplifier-expert-cookbook:arc-agi-solver/recipes/arc-solver.yaml"
    context:
      required:
        - name: task_file
          description: "Path to the ARC task file (markdown or JSON format)"
      optional:
        - name: working_dir
          description: "Output directory for results"
          default: "./arc_output"
        - name: max_iterations
          description: "Maximum refinement attempts per expert"
          default: 3

  - id: cli-tool
    name: "CLI Tool Builder"
    enabled: true
    description: >
      Comprehensive multi-stage CLI application development with pilot
      implementations, building blocks, and extensive testing. This is a
      6-stage process: capability recon, pilot implementations, production
      building blocks, application planning, implementation, and testing.
      ONLY use this when the user explicitly wants a full CLI application
      with the complete development process. For simpler tools or scripts,
      use Generic Task Builder instead.
    recipe: "@amplifier-expert-cookbook:cli-tool-builder/recipes/cli-tool-development.yaml"
    context:
      required:
        - name: cli_description
          description: "Description of the CLI tool to build"
      optional:
        - name: project_dir
          description: "Target directory for the project"
          default: "."
        - name: working_dir
          description: "Directory for intermediate artifacts"
          default: ".ai_working"

  - id: science-solver
    name: "Science Problem Solver"
    enabled: true
    description: >
      Systematic PhD-level scientific problem solver for physics, chemistry,
      biology, and mathematics. Uses a 4-stage approach with approval gates:
      (1) Understand - parse problem, identify given/find/constraints,
      (2) Strategy - classify problem type, develop solution approach with
      emphasis on code verification, (3) Solve - execute step-by-step with
      assumption checking and feedback loops, (4) Verify - check units,
      limiting cases, reasonableness, and write verification code. Use this
      for scientific derivations, proofs, calculations requiring symbolic
      math, unit analysis, or research-level problem solving. NOT for general
      coding tasks - use Generic Task Builder for those.
    recipe: "@amplifier-expert-cookbook:science-solver/recipes/phd-problem-solver.yaml"
    context:
      required:
        - name: problem
          description: "The scientific problem statement to solve"
      optional:
        - name: output_dir
          description: "Directory for intermediate files and verification code"
          default: "./solution_workspace"
        - name: answer_file
          description: "Specific file path for final answer (if required by problem)"
          default: ""

# ============================================================================
# HOW TO ADD A NEW WORKFLOW
# ============================================================================
#
# 1. Copy an existing workflow entry above
# 2. Update the following fields:
#    - id: Unique identifier (lowercase, hyphens)
#    - name: Human-readable name
#    - enabled: Set to true to activate
#    - description: Clear description of what this workflow does and when to use it
#    - recipe: Path to recipe YAML using @bundle:path format
#    - context.required: Variables the user MUST provide
#    - context.optional: Variables with sensible defaults
#
# 3. Create the corresponding recipe in a subdirectory:
#    my-workflow/
#    ├── bundle.md        # Optional: for standalone use
#    ├── README.md
#    └── recipes/
#        └── my-recipe.yaml
#
# ============================================================================
# HOW TO DISABLE A WORKFLOW
# ============================================================================
#
# Set enabled: false on any workflow to prevent routing to it.
# The workflow will still be accessible via direct recipe invocation.
#
# Example:
#   - id: arc-agi
#     enabled: false  # Disabled - won't be routed to automatically
#
